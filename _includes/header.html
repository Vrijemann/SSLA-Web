{%- assign u = page.url -%}
<header class="site-header{% if page.layout != 'home' %} is-solid{% endif %}" id="siteHeader">
  <div class="topbar">
    <div class="container topbar__inner">
      <a href="{{ site.firma.janji_temu }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3z M3 5l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>{{ site.firma.email }}</a>
      <span class="topbar__sep" aria-hidden="true"></span>
      {% for t in site.firma.telepon %}<a href="tel:{{ t.nomor }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" fill="currentColor"/></svg>{{ t.label }}</a>{% endfor %}
    </div>
  </div>
  <div class="mainbar">
    <div class="container mainbar__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand__logo" src="{{ '/assets/img/logo-sagara.png' | relative_url }}" alt="" width="400" height="214">
        <span class="brand__text"><span class="brand__name">Sagara Strategic Legal Advisory</span><span class="brand__tag">Firm You Can Trust</span></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Buka menu"><span></span><span></span><span></span></button>
      <nav class="site-nav" id="siteNav" aria-label="Navigasi utama">
        <a href="{{ '/' | relative_url }}"{% if u == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/about-us/' | relative_url }}"{% if u == '/about-us/' %} aria-current="page"{% endif %}>About Us</a>
        <a href="{{ '/practice-areas/' | relative_url }}"{% if u == '/practice-areas/' %} aria-current="page"{% endif %}>Practice Areas</a>
        <a href="{{ '/legal-insight/' | relative_url }}"{% if u contains '/legal-insight/' %} aria-current="page"{% endif %}>Insight &amp; Updates</a>
        <a href="{{ '/contact/' | relative_url }}"{% if u == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
      </nav>
    </div>
  </div>
</header>
